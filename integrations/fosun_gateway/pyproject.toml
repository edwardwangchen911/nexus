[project]
name = "nexus-fosun-gateway"
version = "0.1.0"
description = "NEXUS isolated Fosun read-only gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50,<51",
    "fastapi>=0.116,<0.141",
    "fsopenapi",
    "httpx>=0.28,<0.29",
    "limits>=5.4,<6",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
nexus-fosun-gateway = "nexus_fosun_gateway.main:run"
nexus-fosun-gateway-ready = "nexus_fosun_gateway.readiness:main"
nexus-fosun-activation-gate = "nexus_fosun_gateway.activation:main"
nexus-fosun-read-only-probe = "nexus_fosun_gateway.probe_cli:run"
nexus-fosun-capture-read-only-probe = "nexus_fosun_gateway.probe_capture:run"
nexus-fosun-probe-publisher-key-preflight = "nexus_fosun_gateway.probe_capture:key_preflight_run"
nexus-fosun-publish-probe-receipt = "nexus_fosun_gateway.probe_receipt:run"
nexus-fosun-simulation-fixture = "nexus_fosun_gateway.simulation_main:run_fixture"

[dependency-groups]
dev = [
    "httpx==0.28.*",
    "hypothesis==6.138.*",
    "mypy==1.17.*",
    "pytest-asyncio==1.4.*",
    "pytest==9.0.*",
    "respx==0.22.*",
    "ruff==0.12.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_fosun_gateway"]

[tool.uv.sources]
fsopenapi = { git = "https://github.com/fosunwealth/openapi-python-sdk.git", rev = "891d95fb4967efaa682387c1b35966ceea38fb21" }
