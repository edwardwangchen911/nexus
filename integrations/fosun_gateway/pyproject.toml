[project]
name = "nexus-fosun-gateway"
version = "0.1.0"
description = "NEXUS isolated Fosun read-only gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=45,<46",
    "fastapi>=0.116,<0.141",
    "httpx>=0.28,<0.29",
    "limits>=5.4,<6",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
nexus-fosun-gateway = "nexus_fosun_gateway.main:run"

[dependency-groups]
dev = [
    "httpx==0.28.*",
    "hypothesis==6.138.*",
    "mypy==1.17.*",
    "pytest-asyncio==1.1.*",
    "pytest==8.4.*",
    "respx==0.22.*",
    "ruff==0.12.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_fosun_gateway"]
