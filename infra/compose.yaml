services:
  postgres:
    image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    ports:
      - "127.0.0.1:${NEXUS_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
    ports:
      - "127.0.0.1:${NEXUS_MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${NEXUS_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-store-init:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/engine.Dockerfile
    command: ["nexus-engine-object-store-init"]
    restart: "no"
    environment:
      - NEXUS_ENV
      - OBJECT_STORE_ENDPOINT
      - OBJECT_STORE_REGION
      - OBJECT_STORE_BUCKET
      - OBJECT_STORE_ACCESS_KEY_ID
      - OBJECT_STORE_SECRET_ACCESS_KEY
    depends_on:
      minio:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/engine.Dockerfile
    command: ["nexus-engine-api"]
    environment:
      - NEXUS_ENV
      - DATABASE_URL
      - OBJECT_STORE_ENDPOINT
      - OBJECT_STORE_REGION
      - OBJECT_STORE_BUCKET
      - OBJECT_STORE_ACCESS_KEY_ID
      - OBJECT_STORE_SECRET_ACCESS_KEY
      - NEXUS_ENGINE_HMAC_SECRET
      - NEXUS_ENGINE_HMAC_CURRENT_KEY_ID
      - NEXUS_ENGINE_HMAC_CURRENT_SECRET
      - NEXUS_ENGINE_HMAC_PREVIOUS_KEY_ID
      - NEXUS_ENGINE_HMAC_PREVIOUS_SECRET
    depends_on:
      postgres:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${NEXUS_API_HOST_PORT:-8000}:8000"

  worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/engine.Dockerfile
    command: ["nexus-engine-worker"]
    environment:
      - NEXUS_ENV
      - DATABASE_URL
      - OBJECT_STORE_ENDPOINT
      - OBJECT_STORE_REGION
      - OBJECT_STORE_BUCKET
      - OBJECT_STORE_ACCESS_KEY_ID
      - OBJECT_STORE_SECRET_ACCESS_KEY
      - NEXUS_ENGINE_HMAC_SECRET
      - NEXUS_ENGINE_HMAC_CURRENT_KEY_ID
      - NEXUS_ENGINE_HMAC_CURRENT_SECRET
      - NEXUS_ENGINE_HMAC_PREVIOUS_KEY_ID
      - NEXUS_ENGINE_HMAC_PREVIOUS_SECRET
      - AGENT_RUNTIME_MODE=${AGENT_RUNTIME_MODE:-fixture}
      - OPENAI_API_KEY
      - OPENAI_EXTRACTION_MODEL
      - OPENAI_REASONING_MODEL
      - NEXUS_PROVIDER_JOBS_ENABLED=${NEXUS_PROVIDER_JOBS_ENABLED:-false}
      - NEXUS_MARKET_PROVIDER=${NEXUS_MARKET_PROVIDER:-fosun}
    depends_on:
      postgres:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully

  provider-worker:
    profiles: ["provider"]
    build:
      context: ..
      dockerfile: infra/docker/engine.Dockerfile
    command: ["nexus-engine-provider-worker"]
    environment:
      - PROVIDER_DATABASE_URL
      - PROVIDER_OBJECT_STORE_ENDPOINT
      - PROVIDER_OBJECT_STORE_REGION
      - PROVIDER_OBJECT_STORE_BUCKET
      - PROVIDER_OBJECT_STORE_ACCESS_KEY_ID
      - PROVIDER_OBJECT_STORE_SECRET_ACCESS_KEY
      - PROVIDER_OBJECT_STORE_PREFIX=provider/market
      - NEXUS_PROVIDER_RUNTIME_MODE=production
      - NEXUS_MARKET_PROVIDER=fosun
      - NEXUS_ALPACA_MARKET_MODE=disabled
      - FOSUN_MARKET_DELIVERY_MODE=${FOSUN_MARKET_DELIVERY_MODE:-unknown}
      - FOSUN_MARKET_GATEWAY_BASE_URL
      - FOSUN_MARKET_GATEWAY_HMAC_CURRENT_KEY_ID
      - FOSUN_MARKET_GATEWAY_HMAC_CURRENT_SECRET
      - FOSUN_MARKET_GATEWAY_CLIENT_CERT
      - FOSUN_MARKET_GATEWAY_CLIENT_KEY
      - FOSUN_MARKET_GATEWAY_CLIENT_CA
      - NEXUS_INTRADAY_MONITOR_MODE=${NEXUS_INTRADAY_MONITOR_MODE:-disabled}
      - NEXUS_INTRADAY_POLL_SECONDS=${NEXUS_INTRADAY_POLL_SECONDS:-15}
      - NEXUS_INTRADAY_MAX_SYMBOLS=${NEXUS_INTRADAY_MAX_SYMBOLS:-10}
      - SEC_CONTACT
      - FRED_API_KEY
    depends_on:
      postgres:
        condition: service_healthy
      fosun-gateway:
        condition: service_healthy

  provider-worker-alpaca:
    profiles: ["provider-alpaca"]
    build:
      context: ..
      dockerfile: infra/docker/engine.Dockerfile
    command: ["nexus-engine-provider-worker"]
    environment:
      - PROVIDER_DATABASE_URL
      - PROVIDER_OBJECT_STORE_ENDPOINT
      - PROVIDER_OBJECT_STORE_REGION
      - PROVIDER_OBJECT_STORE_BUCKET
      - PROVIDER_OBJECT_STORE_ACCESS_KEY_ID
      - PROVIDER_OBJECT_STORE_SECRET_ACCESS_KEY
      - PROVIDER_OBJECT_STORE_PREFIX=provider/market
      - NEXUS_PROVIDER_RUNTIME_MODE=production
      - NEXUS_MARKET_PROVIDER=alpaca
      - NEXUS_ALPACA_MARKET_MODE=enabled
      - ALPACA_API_KEY_ID
      - ALPACA_API_SECRET_KEY
      - ALPACA_DATA_FEED
      - ALPACA_DELIVERY_MODE
      - NEXUS_INTRADAY_MONITOR_MODE=${NEXUS_INTRADAY_MONITOR_MODE:-disabled}
      - NEXUS_INTRADAY_POLL_SECONDS=${NEXUS_INTRADAY_POLL_SECONDS:-15}
      - NEXUS_INTRADAY_MAX_SYMBOLS=${NEXUS_INTRADAY_MAX_SYMBOLS:-30}
      - ALPACA_INTRADAY_FEED
      - ALPACA_INTRADAY_DELIVERY_MODE
      - SEC_CONTACT
      - FRED_API_KEY
    depends_on:
      postgres:
        condition: service_healthy

  broker-worker:
    profiles: ["broker"]
    build:
      context: ..
      dockerfile: infra/docker/engine.Dockerfile
    command: ["nexus-engine-broker-worker"]
    environment:
      - NEXUS_ENV
      - DATABASE_URL
      - FOSUN_GATEWAY_BASE_URL
      - FOSUN_GATEWAY_HMAC_CURRENT_KEY_ID
      - FOSUN_GATEWAY_HMAC_CURRENT_SECRET
      - FOSUN_GATEWAY_CLIENT_CERT
      - FOSUN_GATEWAY_CLIENT_KEY
      - FOSUN_GATEWAY_CLIENT_CA
      - NEXUS_BROKER_EXTERNAL_ID_AEAD_CURRENT_KEY
      - NEXUS_BROKER_EXTERNAL_ID_AEAD_CURRENT_KEY_VERSION
      - NEXUS_BROKER_EXTERNAL_ID_AEAD_PREVIOUS_KEY
      - NEXUS_BROKER_EXTERNAL_ID_AEAD_PREVIOUS_KEY_VERSION
      - NEXUS_BROKER_EXTERNAL_ID_BLIND_INDEX_KEY
    depends_on:
      postgres:
        condition: service_healthy
      fosun-gateway:
        condition: service_healthy

  fosun-gateway:
    profiles: ["provider", "broker"]
    deploy:
      replicas: 1
    build:
      context: ..
      dockerfile: infra/docker/fosun-gateway.Dockerfile
    command: ["nexus-fosun-gateway"]
    environment:
      - NEXUS_ENV
      - FOSUN_GATEWAY_REPLICA_COUNT=1
      - FOSUN_GATEWAY_REPLAY_STORE_PATH=/var/lib/nexus-fosun-gateway/replay.sqlite3
      - FOSUN_GATEWAY_CAPABILITY
      - FOSUN_GATEWAY_TRANSPORT_MODE
      - FOSUN_GATEWAY_HMAC_CURRENT_KEY_ID
      - FOSUN_GATEWAY_HMAC_CURRENT_SECRET
      - FOSUN_GATEWAY_HMAC_PREVIOUS_KEY_ID
      - FOSUN_GATEWAY_HMAC_PREVIOUS_SECRET
      - FOSUN_MARKET_GATEWAY_HMAC_CURRENT_KEY_ID
      - FOSUN_MARKET_GATEWAY_HMAC_CURRENT_SECRET
      - FOSUN_MARKET_GATEWAY_HMAC_PREVIOUS_KEY_ID
      - FOSUN_MARKET_GATEWAY_HMAC_PREVIOUS_SECRET
      - FOSUN_GATEWAY_SERVER_CERT
      - FOSUN_GATEWAY_SERVER_KEY
      - FOSUN_GATEWAY_SERVER_BROKER_CLIENT_CA
      - FOSUN_GATEWAY_SERVER_MARKET_CLIENT_CA
      - FOSUN_SDK_ADMITTED
      - FOSUN_PROVIDER_MANIFEST=/app/contracts/providers/fosun/manifest.json
      - FOSUN_ACTIVATION_PROBE_ARTIFACT=/run/nexus/fosun-activation/probe-artifact.json
      - FOSUN_ACTIVATION_PROBE_RECEIPT=/run/nexus/fosun-activation/publication-receipt.json
      - FOSUN_ACTIVATION_PROBE_PUBLISHER_PUBLIC_KEY_B64U_FILE=/run/nexus/fosun-control/publisher-public-key.b64u
      - FOSUN_ACTIVATION_CONTRACT_HASH_FILE=/run/nexus/fosun-control/activation-contract.sha256
      - FSOPENAPI_API_KEY
      - FSOPENAPI_CLIENT_PRIVATE_KEY
      - FSOPENAPI_SERVER_PUBLIC_KEY
      - FSOPENAPI_BASE_URL
    volumes:
      - fosun-gateway-replay:/var/lib/nexus-fosun-gateway
      - type: bind
        source: ${FOSUN_ACTIVATION_PROBE_ARTIFACT_HOST_FILE:-../.secrets/fosun-activation/probe-artifact.json}
        target: /run/nexus/fosun-activation/probe-artifact.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FOSUN_ACTIVATION_PROBE_RECEIPT_HOST_FILE:-../.secrets/fosun-activation/publication-receipt.json}
        target: /run/nexus/fosun-activation/publication-receipt.json
        read_only: true
        bind:
          create_host_path: false
    configs:
      - source: fosun-activation-publisher-key
        target: /run/nexus/fosun-control/publisher-public-key.b64u
        mode: 0444
      - source: fosun-activation-contract-hash
        target: /run/nexus/fosun-control/activation-contract.sha256
        mode: 0444
    healthcheck:
      test: ["CMD", "nexus-fosun-gateway-ready"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 65s

  # Phase 3A static-only profile. It compiles the isolated fixture surface and
  # deliberately gives the broker worker no in-process fixture dependency, so
  # starting the profile fails closed until a separately reviewed composition
  # and Phase 3B admission package replace this guard configuration.
  broker-simulation-worker:
    profiles: ["broker-simulation"]
    build:
      context: ..
      dockerfile: infra/docker/engine.Dockerfile
    command: ["nexus-engine-broker-worker"]
    environment:
      - NEXUS_ENV=${NEXUS_BROKER_SIMULATION_ENV:-test}
      - DATABASE_URL
      - NEXUS_BROKER_SIMULATION_MODE=offline_fixture
      - FOSUN_GATEWAY_BASE_URL=${FOSUN_SIMULATION_GATEWAY_BASE_URL:-}
      - FOSUN_GATEWAY_HMAC_CURRENT_KEY_ID=${FOSUN_SIMULATION_GATEWAY_HMAC_CURRENT_KEY_ID:-}
      - FOSUN_GATEWAY_HMAC_CURRENT_SECRET=${FOSUN_SIMULATION_GATEWAY_HMAC_CURRENT_SECRET:-}
      - FOSUN_GATEWAY_CLIENT_CERT=${FOSUN_SIMULATION_GATEWAY_CLIENT_CERT:-}
      - FOSUN_GATEWAY_CLIENT_KEY=${FOSUN_SIMULATION_GATEWAY_CLIENT_KEY:-}
      - FOSUN_GATEWAY_CLIENT_CA=${FOSUN_SIMULATION_GATEWAY_CLIENT_CA:-}
      - NEXUS_BROKER_EXTERNAL_ID_AEAD_CURRENT_KEY=${NEXUS_SIMULATION_EXTERNAL_ID_AEAD_CURRENT_KEY:-}
      - NEXUS_BROKER_EXTERNAL_ID_AEAD_CURRENT_KEY_VERSION=${NEXUS_SIMULATION_EXTERNAL_ID_AEAD_CURRENT_KEY_VERSION:-}
      - NEXUS_BROKER_EXTERNAL_ID_AEAD_PREVIOUS_KEY=${NEXUS_SIMULATION_EXTERNAL_ID_AEAD_PREVIOUS_KEY:-}
      - NEXUS_BROKER_EXTERNAL_ID_AEAD_PREVIOUS_KEY_VERSION=${NEXUS_SIMULATION_EXTERNAL_ID_AEAD_PREVIOUS_KEY_VERSION:-}
      - NEXUS_BROKER_EXTERNAL_ID_BLIND_INDEX_KEY=${NEXUS_SIMULATION_EXTERNAL_ID_BLIND_INDEX_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      fosun-simulation-gateway:
        condition: service_started

  fosun-simulation-gateway:
    profiles: ["broker-simulation"]
    build:
      context: ..
      dockerfile: infra/docker/fosun-gateway.Dockerfile
    command: ["nexus-fosun-simulation-fixture"]
    environment:
      - NEXUS_ENV=${NEXUS_BROKER_SIMULATION_ENV:-test}
      - FOSUN_GATEWAY_TRANSPORT_MODE=fixture
      - FOSUN_GATEWAY_HMAC_CURRENT_KEY_ID=${FOSUN_SIMULATION_GATEWAY_HMAC_CURRENT_KEY_ID:-}
      - FOSUN_GATEWAY_HMAC_CURRENT_SECRET=${FOSUN_SIMULATION_GATEWAY_HMAC_CURRENT_SECRET:-}
      - FOSUN_GATEWAY_HMAC_PREVIOUS_KEY_ID=${FOSUN_SIMULATION_GATEWAY_HMAC_PREVIOUS_KEY_ID:-}
      - FOSUN_GATEWAY_HMAC_PREVIOUS_SECRET=${FOSUN_SIMULATION_GATEWAY_HMAC_PREVIOUS_SECRET:-}
      - FOSUN_GATEWAY_SERVER_CERT=${FOSUN_SIMULATION_GATEWAY_SERVER_CERT:-}
      - FOSUN_GATEWAY_SERVER_KEY=${FOSUN_SIMULATION_GATEWAY_SERVER_KEY:-}
      - FOSUN_GATEWAY_SERVER_CLIENT_CA=${FOSUN_SIMULATION_GATEWAY_SERVER_CLIENT_CA:-}

volumes:
  fosun-gateway-replay:
    external: true
    name: nexus-fosun-gateway-replay-v1

configs:
  fosun-activation-publisher-key:
    file: ${FOSUN_ACTIVATION_PUBLISHER_KEY_CONFIG_FILE:-../.secrets/fosun-control/publisher-public-key.b64u}
  fosun-activation-contract-hash:
    file: ${FOSUN_ACTIVATION_CONTRACT_HASH_CONFIG_FILE:-../.secrets/fosun-control/activation-contract.sha256}
