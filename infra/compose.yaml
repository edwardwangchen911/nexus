services:
  postgres:
    image: postgres:17
    env_file:
      - path: ./env.example
        required: false
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    env_file:
      - path: ./env.example
        required: false
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/engine.Dockerfile
    command: ["nexus-engine-api"]
    env_file:
      - path: ./env.example
        required: false
    environment:
      - NEXUS_ENV
      - DATABASE_URL
      - OBJECT_STORE_ENDPOINT
      - OBJECT_STORE_REGION
      - OBJECT_STORE_BUCKET
      - OBJECT_STORE_ACCESS_KEY_ID
      - OBJECT_STORE_SECRET_ACCESS_KEY
      - NEXUS_ENGINE_HMAC_SECRET
      - NEXUS_ENGINE_HMAC_CURRENT_KEY_ID
      - NEXUS_ENGINE_HMAC_CURRENT_SECRET
      - NEXUS_ENGINE_HMAC_PREVIOUS_KEY_ID
      - NEXUS_ENGINE_HMAC_PREVIOUS_SECRET
      - FOSUN_GATEWAY_BASE_URL
      - FOSUN_GATEWAY_HMAC_SECRET
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/engine.Dockerfile
    command: ["nexus-engine-worker"]
    env_file:
      - path: ./env.example
        required: false
    environment:
      - NEXUS_ENV
      - DATABASE_URL
      - OBJECT_STORE_ENDPOINT
      - OBJECT_STORE_REGION
      - OBJECT_STORE_BUCKET
      - OBJECT_STORE_ACCESS_KEY_ID
      - OBJECT_STORE_SECRET_ACCESS_KEY
      - NEXUS_ENGINE_HMAC_SECRET
      - NEXUS_ENGINE_HMAC_CURRENT_KEY_ID
      - NEXUS_ENGINE_HMAC_CURRENT_SECRET
      - NEXUS_ENGINE_HMAC_PREVIOUS_KEY_ID
      - NEXUS_ENGINE_HMAC_PREVIOUS_SECRET
      - FOSUN_GATEWAY_BASE_URL
      - FOSUN_GATEWAY_HMAC_SECRET
      - OPENAI_API_KEY
      - OPENAI_EXTRACTION_MODEL
      - OPENAI_REASONING_MODEL
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  fosun-gateway:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/fosun-gateway.Dockerfile
    command: ["nexus-fosun-gateway"]
    env_file:
      - path: ./env.example
        required: false
    environment:
      - NEXUS_ENV
      - FOSUN_GATEWAY_CAPABILITY
      - FOSUN_GATEWAY_HMAC_SECRET
      - FOSUN_GATEWAY_CLIENT_CERT
      - FOSUN_GATEWAY_CLIENT_KEY
      - FOSUN_GATEWAY_CLIENT_CA
      - FSOPENAPI_API_KEY
      - FSOPENAPI_CLIENT_PRIVATE_KEY
      - FSOPENAPI_SERVER_PUBLIC_KEY
      - FSOPENAPI_BASE_URL
