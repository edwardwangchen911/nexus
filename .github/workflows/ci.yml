name: NEXUS CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.19.0"
  UV_VERSION: "0.12.1"

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:generated
      - run: npm run build

  gateway-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen --package nexus-fosun-gateway
      - name: Prove loopback-only network guard
        env:
          NEXUS_OFFLINE_SOCKET_GUARD: "1"
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_guard
        run: uv run python scripts/offline_guard/selftest.py
      - name: Run every gateway test offline
        env:
          NEXUS_OFFLINE_SOCKET_GUARD: "1"
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_guard
        run: |
          install -d -m 700 "${{ github.workspace }}/.nexus-pytest"
          uv run pytest integrations/fosun_gateway/tests -q \
            --basetemp="${{ github.workspace }}/.nexus-pytest/gateway"
      - run: uv run ruff check integrations/fosun_gateway scripts/offline_guard
      - run: uv run mypy integrations/fosun_gateway/src

  engine-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_DB: nexus_ci
          POSTGRES_USER: nexus_ci
          POSTGRES_PASSWORD: synthetic_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_ci -d nexus_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NEXUS_ENV: test
      DATABASE_URL: postgresql+asyncpg://nexus_ci:synthetic_ci_only@127.0.0.1:5432/nexus_ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check engine
      - run: uv run mypy engine/src
      - run: uv run alembic -c engine/alembic.ini upgrade head
      - name: Run merge-gate Engine tests
        if: github.event_name != 'workflow_dispatch'
        run: |
          uv run pytest -q --import-mode=importlib -m "not performance" \
            engine/tests/unit \
            engine/tests/contract \
            engine/tests/evals \
            engine/tests/property \
            engine/tests/test_health.py \
            engine/tests/integration/test_temporary_database_lifecycle.py \
            engine/tests/integration/test_job_checkpoint.py \
            engine/tests/integration/test_portfolio_api.py \
            engine/tests/integration/test_optimization_writer.py \
            engine/tests/integration/test_formal_optimization_producer.py \
            engine/tests/integration/test_scenario_spread_cost_authority_pg.py \
            engine/tests/integration/test_scenario_selection_migration.py \
            engine/tests/integration/test_fosun_identity_selection.py \
            engine/tests/integration/test_fosun_instrument_discovery_storage.py \
            engine/tests/integration/test_fosun_refresh_order_pg.py \
            engine/tests/integration/test_fosun_security_classification_storage.py \
            engine/tests/integration/test_fosun_security_classification_migration.py \
            engine/tests/integration/test_fosun_push_local.py \
            engine/tests/integration/test_market_database_series_pg.py \
            engine/tests/integration/test_real_fixture_db_guard.py \
            engine/tests/integration/test_risk_authority_pg.py \
            engine/tests/integration/test_paper_idempotency_pg.py \
            engine/tests/integration/test_paper_db_guards.py \
            engine/tests/integration/test_broker_simulation_reconciliation.py \
            engine/tests/integration/test_agent_paper_cycle_migration.py \
            engine/tests/integration/test_agent_paper_market_migration.py \
            engine/tests/integration/test_agent_paper_decision_pg.py \
            engine/tests/integration/test_agent_paper_cycle_pg.py \
            engine/tests/integration/test_agent_paper_market_pg.py \
            engine/tests/integration/test_fred_research_context.py \
            engine/tests/integration/test_agent_paper_cycle_e2e.py \
            engine/tests/integration/test_portfolio_decision_e2e.py \
            engine/tests/integration/test_portfolio_decision_admission_pg.py \
            engine/tests/integration/test_manual_paper_api_pg.py \
            engine/tests/integration/test_manual_paper_job_binding_pg.py \
            engine/tests/integration/test_current_preparation_recovery_pg.py \
            engine/tests/integration/test_agent_paper_identity_preparation.py \
            engine/tests/integration/test_manual_paper_cycle_pg.py \
            engine/tests/integration/test_manual_partial_history_seal_pg.py::test_explicit_manual_seal_retains_known_lower_bound_and_closes_unused_jobs \
            engine/tests/integration/test_sec_exhibit_import.py \
            engine/tests/integration/test_candidate_multistock_path.py::test_v10_manual_entry_to_result \
            engine/tests/integration/test_candidate_multistock_path.py::test_v10_manual_entry_failure_preserves_recovery_gates \
            engine/tests/integration/test_capacity_rejection_pg.py \
            engine/tests/integration/test_unknown_preparation_ack_pg.py \
            engine/tests/integration/test_formal_v10_runtime_admission.py \
            engine/tests/integration/test_full_input_capacity_cycle.py::test_formal_v10_research_deadline_preserves_unknown_usage_and_closes_cycle \
            engine/tests/integration/test_formal_resume_observation_clock.py
      - name: Run full Engine regression manually
        if: github.event_name == 'workflow_dispatch'
        run: uv run pytest engine/tests -q --import-mode=importlib
      - name: Run isolated PostgreSQL and MinIO recovery drill
        if: github.event_name == 'workflow_dispatch'
        env:
          NEXUS_ENV: test
        run: uv run --package nexus-engine nexus-engine-backup-restore-drill

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXUS_E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=3
      - name: Upload synthetic failure evidence only
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-e2e-failure-${{ github.run_id }}
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: false

  real-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_DB: nexus_e2e_ci
          POSTGRES_USER: nexus_e2e_ci
          POSTGRES_PASSWORD: nexus_e2e_synthetic_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_e2e_ci -d nexus_e2e_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NEXUS_REAL_E2E_DATABASE_URL: postgresql+asyncpg://nexus_e2e_ci:nexus_e2e_synthetic_ci_only@127.0.0.1:5432/nexus_e2e_ci
      NEXUS_E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: npm ci
      - run: uv sync --frozen --package nexus-engine
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:real
      - name: Verify formal v10 manual entry through fills, ledger and pages
        env:
          NEXUS_ENV: test
          DATABASE_URL: postgresql+asyncpg://nexus_e2e_ci:nexus_e2e_synthetic_ci_only@127.0.0.1:5432/nexus_e2e_ci
          NEXUS_CONTROLLED_BROWSER: "1"
        run: >-
          uv run --package nexus-engine pytest -q --import-mode=importlib
          engine/tests/integration/test_candidate_multistock_path.py::test_v10_manual_entry_to_result
          -k buy
      - name: Verify unknown recovery through configured entry and Workspace
        env:
          NEXUS_ENV: test
          DATABASE_URL: postgresql+asyncpg://nexus_e2e_ci:nexus_e2e_synthetic_ci_only@127.0.0.1:5432/nexus_e2e_ci
          NEXUS_CONTROLLED_BROWSER: "1"
        run: >-
          uv run --package nexus-engine pytest -q --import-mode=importlib
          'engine/tests/integration/test_current_preparation_recovery_pg.py::test_current_host_interruption_recovers_via_normal_cli[accept_prepared_closed]'
      - name: Upload real fixture failure evidence only
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-real-e2e-failure-${{ github.run_id }}
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: false

  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: npm ci
      - run: uv sync --frozen --all-packages
      - run: uv run pytest tests/policy -q
      - name: Run repository and license policy
        run: >-
          uv run python scripts/ci/repository_policy.py
          --root .
          --inventory-output "$RUNNER_TEMP/nexus-dependency-inventory.json"
      - run: uv run python scripts/ci/npm_audit_gate.py --report "$RUNNER_TEMP/nexus-npm-audit.json"
      - run: uv run pip-audit --local --skip-editable
      - name: Validate all Compose capability profiles
        env:
          NEXUS_ENV: test
          DATABASE_URL: postgresql+asyncpg://nexus_ci:synthetic_ci_only@postgres:5432/nexus_ci
          OBJECT_STORE_ENDPOINT: http://minio:9000
          OBJECT_STORE_REGION: us-east-1
          OBJECT_STORE_BUCKET: nexus-ci
          OBJECT_STORE_ACCESS_KEY_ID: synthetic-ci-access
          OBJECT_STORE_SECRET_ACCESS_KEY: synthetic-ci-secret
          POSTGRES_DB: nexus_ci
          POSTGRES_USER: nexus_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          MINIO_ROOT_USER: synthetic-ci-minio
          MINIO_ROOT_PASSWORD: synthetic-ci-minio-secret
        run: |
          docker compose -f infra/compose.yaml --profile app config --quiet
          docker compose -f infra/compose.yaml --profile broker config --quiet
          docker compose -f infra/compose.yaml --profile provider config --quiet
          docker compose -f infra/compose.yaml --profile provider-alpaca config --quiet
