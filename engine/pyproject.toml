[project]
name = "nexus-engine"
version = "0.1.0"
description = "NEXUS research and paper-trading engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "boto3>=1.40,<2",
    "cryptography>=50,<51",
    "duckdb>=1.3,<2",
    "exchange-calendars==4.13.2",
    "fastapi>=0.116,<0.141",
    "httpx>=0.28,<0.29",
    "websockets==17.1",
    "jsonschema>=4.25,<5",
    "openai>=1.100,<2",
    "openai-codex==0.147.0",
    "polars>=1.32,<2",
    "pyarrow>=23.0.1,<24",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tiktoken==0.14.0",
    "uuid6>=2025.0.1,<2026",
    "uvicorn>=0.35,<1",
]

[project.scripts]
nexus-engine-api = "nexus.main:run"
nexus-engine-backup-restore-drill = "nexus.ops.backup_restore:main"
nexus-engine-broker-worker = "nexus.broker_worker:main"
nexus-engine-object-store-init = "nexus.object_store_init:main"
nexus-engine-provider-worker = "nexus.provider_worker:main"
nexus-engine-provider-worker-local = "nexus.ops.provider_worker_local:main"
nexus-engine-fosun-local-refresh = "nexus.ops.fosun_local_refresh:main"
nexus-engine-fosun-push-local = "nexus.ops.fosun_push_local:main"
nexus-engine-alpaca-market-stream = "nexus.ops.alpaca_market_stream:main"
nexus-engine-agent-paper-once = "nexus.ops.agent_paper_once:main"
nexus-engine-agent-risk-authority = "nexus.ops.agent_risk_authority:main"
nexus-engine-sector-exposure-local = "nexus.ops.sector_exposure_local:main"
nexus-engine-schwab-market-stream = "nexus.ops.schwab_market_stream:main"
nexus-fosun-local = "nexus.ops.fosun_local:main"
nexus-pending-identity-local = "nexus.ops.pending_identity_local:main"
nexus-engine-strategy-rnd-worker = "nexus.evolution.worker:main"
nexus-engine-worker = "nexus.worker:main"
nexus-local-stack = "nexus.ops.local_stack:main"
nexus-openai-local = "nexus.ops.openai_local:main"

[dependency-groups]
dev = [
    "httpx==0.28.*",
    "hypothesis==6.138.*",
    "mypy==1.17.*",
    "pytest-asyncio==1.4.*",
    "pytest==9.0.*",
    "respx==0.22.*",
    "ruff==0.12.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.hatch.build.targets.wheel.force-include]
"../contracts/strategy/strategy-dsl.schema.json" = "nexus/strategy/strategy-dsl.schema.json"
"../contracts/strategy/strategy-evolution.schema.json" = "nexus/evolution/strategy-evolution.schema.json"
