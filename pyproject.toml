[project]
name = "nexus-workspace"
version = "0.1.0"
description = "NEXUS Python service workspace"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["engine", "integrations/fosun_gateway"]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"engine/alembic/versions/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "performance: wall-clock performance checks that run in the manual full regression",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning",
]
